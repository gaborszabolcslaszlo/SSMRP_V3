#!/usr/bin/env python
PACKAGE = "robot"


from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

direction = gen.enum([ gen.const("Left", int_t, -1, "Left"),
			           gen.const("Right", int_t, 1, "Right")],
			             "Direction")

#       Name                    Type      Reconfiguration level
#       Description
#                                                    Default  Min  Max
gen.add("angularZ_scale", double_t, 1, "scale and direction factor for vz", 0.1,  -1, 1)
gen.add("maxOutputValue", int_t, 1, "Maximum reference value", 10,  -2000, 2000)
gen.add("deadManA_button", int_t, 1, "Dead man button1 number", 1,  0, 100)
gen.add("deadManB_button", int_t, 1, "Dead man button2 number", 1,  0, 100)
gen.add("controlMode_button", int_t, 1, "Control mode ", 1,  0, 100)
gen.add("vx_Axis", int_t, 1, "Axis of vx speed", 1,  0, 100)
gen.add("vz_Axis", int_t, 1, "Axis of vz speed", 0,  0, 100)

gen.add("VxDown_button", int_t, 1, "desc speed of vx", 1,  0, 100)
gen.add("VxUp_button", int_t, 1, "inc speed of vx", 0,  0, 100)

gen.add("VdeltaDown_button", int_t, 1, "desc speed of omega z", 1,  0, 100)
gen.add("VdeltaUp_button", int_t, 1, "inc speed of omega z", 0,  0, 100)

exit(gen.generate(PACKAGE, "TeleopJoy", "RobotJoy"))
