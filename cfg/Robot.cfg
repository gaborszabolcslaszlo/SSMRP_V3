#!/usr/bin/env python
PACKAGE = "robot"


from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

direction = gen.enum([ gen.const("Left", int_t, 0, "Left"),
			           gen.const("Right", int_t, 1, "Right")],
			             "Direction")

#       Name                    Type      Reconfiguration level
#       Description
#                                                    Default  Min  Max
gen.add("NodeId", int_t, 1, "Period Sampling Timer", 100,  1, 65600)
gen.add("TsTimerPeriod", int_t, 1, "Period Sampling Timer", 10,  1, 2000)
gen.add("GetDataPeriodical", int_t, 1, "Period Sampling Timer [ms]", 1,  0, 1)
gen.add("LogLevel", int_t, 1, "", 71,  65, 71)
gen.add("MaxGradePerSec",   double_t,   0, "dead row", 100,  0, 600)
gen.add("FPGA_clk_period",   int_t,   0, "[ns]", 10,  1, 1000)

left = gen.add_group("Left")
left.add("PwmFreqventi_L",   double_t,   0, "[Hz]",5000,   400, 1000000)
left.add("HbridgeCharge_L",  double_t,   0, "[%]", 3,  0, 10000)
left.add("IncrementalSensorResolution_L",   int_t,   0, "[imp/rot]", 600,  0, 10000)
left.add("IncrementalSensorDirection_L",   int_t,   0, "[dir]", 1,  -1, 1, edit_method=direction)
left.add("IncSenVelocityAvgFilterSize_L",   int_t,   0, "[cnt]", 600,  0, 100)

right = gen.add_group("Right")
right.add("PwmFreqventi_R",   double_t,   0, "[Hz]",5000,   4000, 1000000)
right.add("HbridgeCharge_R",  double_t,   0, "[%]", 3,  0, 10000)
right.add("IncrementalSensorResolution_R",   int_t,   0, "[imp/rot]", 600,  0, 10000)
right.add("IncrementalSensorDirection_R",   int_t,   0, "[dir]", 1,  -1, 1, edit_method=direction)
left.add("IncSenVelocityAvgFilterSize_R",   int_t,   0, "[cnt]", 600,  0, 100)
                 


exit(gen.generate(PACKAGE, "node_v1", "Robot"))
